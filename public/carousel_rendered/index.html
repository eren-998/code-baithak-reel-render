<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jev AI Explained Simply — Code Baithak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #F4F5F7;
      --card-bg: #FFFFFF;
      --border: #1F2937;
      --accent: #2563EB;
      --red: #DC2626;
      --green: #16A34A;
      --text: #111827;
      --text-muted: #4B5563;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(to right, #E5E7EB 1px, transparent 1px),
        linear-gradient(to bottom, #E5E7EB 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 80px;
    }
    header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 2px solid var(--border);
      color: var(--text);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 3px 3px 0px var(--border);
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 46px);
      font-weight: 900;
      letter-spacing: -1px;
      font-family: 'Patrick Hand', cursive, sans-serif;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    h1 span {
      color: var(--red);
      text-decoration: underline;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 17px;
      font-style: italic;
    }
    .top-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0 28px;
    }
    .btn {
      appearance: none;
      border: 2px solid var(--border);
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      box-shadow: 3px 3px 0px var(--border);
      text-decoration: none;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }
    .btn-primary {
      background: #2563EB;
      color: white;
    }
    .btn-secondary {
      background: #FFFFFF;
      color: var(--text);
    }
    /* Main Carousel Stage */
    .stage-container {
      width: 100%;
      max-width: 640px;
      margin-bottom: 36px;
      position: relative;
    }
    .slide-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 Aspect Ratio */
      border-radius: 24px;
      overflow: hidden;
      background: #FFFFFF;
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0px var(--border);
    }
    .slide-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }
    .stage-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2.5px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 3px 3px 0px var(--border);
      transition: all 0.15s;
      z-index: 10;
    }
    .stage-nav:active {
      transform: translateY(-50%) translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }
    .nav-prev { left: -25px; }
    .nav-next { right: -25px; }
    .stage-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 0 8px;
    }
    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dot.active {
      width: 32px;
      background: var(--red);
      border-color: var(--border);
    }
    .slide-info {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--green);
    }

    /* Grid View Section */
    .section-title {
      font-size: 24px;
      font-weight: 900;
      margin: 40px 0 20px;
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Patrick Hand', cursive, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }
    .grid-card {
      background: #FFFFFF;
      border: 2.5px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 4px 0px var(--border);
      transition: transform 0.15s;
    }
    .grid-card:hover {
      transform: translateY(-3px);
    }
    .grid-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      cursor: pointer;
      border-bottom: 2px solid var(--border);
    }
    .grid-card-body {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid-card-title {
      font-size: 15px;
      font-weight: 800;
    }
    .btn-download-sm {
      background: #2563EB;
      color: white;
      border: 1.5px solid var(--border);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border);
    }

    @media (max-width: 600px) {
      .nav-prev { left: 8px; }
      .nav-next { right: 8px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">⚡ CODE BAITHAK ORIGINAL</div>
    <h1>Jev AI <span>Explained Simply</span></h1>
    <p class="sub">The AI that doesn't talk... it just decides! (6 Slide Carousel)</p>
    
    <div class="top-actions">
      <button class="btn btn-primary" onclick="downloadAllZip()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
        Download All 6 Slides (ZIP)
      </button>
      <button class="btn btn-secondary" onclick="downloadCurrentSlide()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Download Slide <span id="currentSlideNum">1</span>
      </button>
    </div>
  </header>

  <!-- Interactive Carousel Stage -->
  <div class="stage-container">
    <button class="stage-nav nav-prev" onclick="prevSlide()" aria-label="Previous">❮</button>
    <button class="stage-nav nav-next" onclick="nextSlide()" aria-label="Next">❯</button>
    
    <div class="slide-wrapper">
      <img id="mainSlideImg" class="slide-img" src="slide_1.png" alt="Slide Preview">
    </div>

    <div class="stage-footer">
      <div class="dots" id="dotsContainer"></div>
      <div class="slide-info" id="slideCounterLabel">Slide 1 / 6</div>
    </div>
  </div>

  <!-- All 6 Slides Grid -->
  <div class="section-title">
    <span>All 6 Slides (Click to view full size / download)</span>
  </div>

  <div class="grid" id="slidesGrid"></div>

  <script>
    const totalSlides = 6;
    let currentIdx = 1;
    const titles = [
      "1: Cover (Headshot + Normal AI vs Jev)",
      "2: What is Jev? (Facts & Difference)",
      "3: Easy Example: 2 Employees",
      "4: How Does It Work? (3 Steps)",
      "5: Many Questions At Once (Flow Tree)",
      "6: In One Line... (Formula & CTA)"
    ];

    function updateStage() {
      const img = document.getElementById('mainSlideImg');
      img.src = `slide_${currentIdx}.png`;
      document.getElementById('currentSlideNum').innerText = currentIdx;
      document.getElementById('slideCounterLabel').innerText = `Slide ${currentIdx} / ${totalSlides}`;
      
      document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.classList.toggle('active', idx + 1 === currentIdx);
      });
    }

    function nextSlide() {
      currentIdx = currentIdx < totalSlides ? currentIdx + 1 : 1;
      updateStage();
    }

    function prevSlide() {
      currentIdx = currentIdx > 1 ? currentIdx - 1 : totalSlides;
      updateStage();
    }

    function goToSlide(n) {
      currentIdx = n;
      updateStage();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function downloadCurrentSlide() {
      const a = document.createElement('a');
      a.href = `slide_${currentIdx}.png`;
      a.download = `jev_ai_slide_${currentIdx}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function downloadAllZip() {
      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Creating ZIP...";
      btn.disabled = true;

      try {
        const zip = new JSZip();
        for (let i = 1; i <= totalSlides; i++) {
          const res = await fetch(`slide_${i}.png`);
          const blob = await res.blob();
          zip.file(`jev_ai_slide_${i}.png`, blob);
        }
        const content = await zip.generateAsync({ type: "blob" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = "jev_ai_carousel_code_baithak.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        alert("Downloading slides individually...");
        for (let i = 1; i <= totalSlides; i++) {
          const a = document.createElement('a');
          a.href = `slide_${i}.png`;
          a.download = `jev_ai_slide_${i}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    const dotsContainer = document.getElementById('dotsContainer');
    const gridContainer = document.getElementById('slidesGrid');

    for (let i = 1; i <= totalSlides; i++) {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 1 ? 'active' : ''}`;
      dot.onclick = () => goToSlide(i);
      dotsContainer.appendChild(dot);

      const card = document.createElement('div');
      card.className = 'grid-card';
      card.innerHTML = `
        <img src="slide_${i}.png" alt="Slide ${i}" onclick="goToSlide(${i})">
        <div class="grid-card-body">
          <div class="grid-card-title">${titles[i-1]}</div>
          <a class="btn-download-sm" href="slide_${i}.png" download="jev_ai_slide_${i}.png">Download</a>
        </div>
      `;
      gridContainer.appendChild(card);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });
  </script>
</body>
</html>
